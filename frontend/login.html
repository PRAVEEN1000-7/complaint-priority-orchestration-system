<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login ComplaintOS</title>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <div class="auth-container">
      <h1>ComplaintOS</h1>
      <p>Sign in to your account</p>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required />
        </div>
        <div
          id="errorMsg"
          style="
            display: none;
            color: var(--p1);
            margin-bottom: 1rem;
            font-size: 0.9rem;
          "
        ></div>
        <button type="submit" id="loginBtn" class="btn btn-primary btn-block">
          Sign In
        </button>
      </form>
      <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem">
        Don't have an account? <a href="/static/register.html">Register here</a>
      </p>
    </div>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/app.js"></script>
    <script>
      if (getToken()) {
        const user = getUser();
        window.location.href =
          user && user.role === "admin"
            ? "/static/admin.html"
            : "/static/dashboard.html";
      }
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = document.getElementById("loginBtn");
          const errorMsg = document.getElementById("errorMsg");
          errorMsg.style.display = "none";
          btn.disabled = true;
          btn.textContent = "Signing in...";
          try {
            const data = await api.post("/login", {
              email: document.getElementById("email").value,
              password: document.getElementById("password").value,
            });
            setToken(data.access_token);
            setUser(data.user);
            showToast("Login successful!", "success");
            setTimeout(() => {
              window.location.href =
                data.user.role === "admin"
                  ? "/static/admin.html"
                  : "/static/dashboard.html";
            }, 500);
          } catch (error) {
            errorMsg.textContent = error.message;
            errorMsg.style.display = "block";
            btn.disabled = false;
            btn.textContent = "Sign In";
          }
        });
    </script>
  </body>
</html>
