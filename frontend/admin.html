<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel ComplaintOS</title>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <nav id="navbar"></nav>
    <main class="container">
      <div class="header-actions">
        <h1>Admin Panel</h1>
        <div style="display: flex; gap: 1rem">
          <button class="btn btn-primary" onclick="showModal('domainModal')">
            New Category
          </button>
          <button class="btn btn-primary" onclick="openDomainHeadModal()">
            New Domain Head
          </button>
        </div>
      </div>
      <div class="grid" id="stats-container"></div>
      <div class="card" style="margin-bottom: 2rem">
        <h3>Categories (Domains)</h3>
        <div id="domains-container"></div>
      </div>
      <div class="card" style="margin-bottom: 2rem">
        <h3>Domain Heads</h3>
        <div id="heads-container"></div>
      </div>
    </main>
    <div class="modal-overlay" id="domainModal" style="display: none">
      <div class="modal">
        <h3>Add Category</h3>
        <form id="domainForm">
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="domain_name" required />
          </div>
          <div
            style="
              display: flex;
              justify-content: flex-end;
              gap: 1rem;
              margin-top: 1.5rem;
            "
          >
            <button
              type="button"
              class="btn btn-secondary"
              onclick="hideModal('domainModal')"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary" id="btn-save-domain">
              Save
            </button>
          </div>
        </form>
      </div>
    </div>
    <div class="modal-overlay" id="headModal" style="display: none">
      <div class="modal">
        <h3>Add Domain Head</h3>
        <form id="headForm">
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="dh_name" required />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="dh_email" required />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="dh_password" required minlength="6" />
          </div>
          <div class="form-group">
            <label>Category (Domain)</label>
            <select id="dh_domain_id" required></select>
          </div>
          <div
            style="
              display: flex;
              justify-content: flex-end;
              gap: 1rem;
              margin-top: 1.5rem;
            "
          >
            <button
              type="button"
              class="btn btn-secondary"
              onclick="hideModal('headModal')"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary" id="btn-save-dh">
              Save
            </button>
          </div>
        </form>
      </div>
    </div>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/app.js"></script>
    <script>
      requireAuth();
      requireRole("admin");
      let allDomains = [];
      async function loadAdminData() {
        try {
          const stats = await api.get("/admin/statistics");
          const statsHtml = Object.entries(stats)
            .map(
              ([k, v]) => `
                    <div class="card">
                        <h3>${k.replace(/_/g, " ")}</h3>
                        <div class="value">${v}</div>
                    </div>
                `,
            )
            .join("");
          document.getElementById("stats-container").innerHTML = statsHtml;
          allDomains = await api.get("/domains");
          const domSelect = document.getElementById("dh_domain_id");
          domSelect.innerHTML = '<option value="">Select a category</option>';
          let domHtml =
            '<div class="table-responsive"><table><thead><tr><th>Name</th><th>Action</th></tr></thead><tbody>';
          allDomains.forEach((d) => {
            domSelect.innerHTML += `<option value="${d.id}">${d.domain_name}</option>`;
            domHtml += `
                        <tr>
                            <td>${d.domain_name}</td>
                            <td><button class="btn btn-secondary" style="padding:0.25rem 0.5rem; font-size:0.8rem;" onclick="deleteDomain('${d.id}')">Delete</button></td>
                        </tr>
                    `;
          });
          domHtml += "</tbody></table></div>";
          document.getElementById("domains-container").innerHTML = domHtml;
          const heads = await api.get("/admin/domain-heads");
          let headHtml =
            '<div class="table-responsive"><table><thead><tr><th>Name</th><th>Email</th><th>Category</th><th>Action</th></tr></thead><tbody>';
          heads.forEach((h) => {
            headHtml += `
                        <tr>
                            <td>${h.user_name}</td>
                            <td>${h.user_email}</td>
                            <td>${h.domain_name}</td>
                            <td><button class="btn btn-secondary" style="padding:0.25rem 0.5rem; font-size:0.8rem;" onclick="deleteHead('${h.id}')">Delete</button></td>
                        </tr>
                    `;
          });
          headHtml += "</tbody></table></div>";
          document.getElementById("heads-container").innerHTML = headHtml;
        } catch (err) {
          showToast(err.message, "error");
        }
      }
      function showModal(id) {
        document.getElementById(id).style.display = "flex";
      }
      function hideModal(id) {
        document.getElementById(id).style.display = "none";
      }
      function openDomainHeadModal() {
        document.getElementById("headForm").reset();
        showModal("headModal");
      }
      document
        .getElementById("domainForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = document.getElementById("btn-save-domain");
          btn.disabled = true;
          try {
            await api.post("/domains", {
              domain_name: document.getElementById("domain_name").value,
            });
            showToast("Category created", "success");
            hideModal("domainModal");
            loadAdminData();
          } catch (err) {
            showToast(err.message, "error");
          } finally {
            btn.disabled = false;
          }
        });
      document
        .getElementById("headForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = document.getElementById("btn-save-dh");
          btn.disabled = true;
          try {
            await api.post("/admin/domain-heads", {
              name: document.getElementById("dh_name").value,
              email: document.getElementById("dh_email").value,
              password: document.getElementById("dh_password").value,
              domain_id: document.getElementById("dh_domain_id").value,
            });
            showToast("Domain Head created", "success");
            hideModal("headModal");
            loadAdminData();
          } catch (err) {
            showToast(err.message, "error");
          } finally {
            btn.disabled = false;
          }
        });
      async function deleteDomain(id) {
        if (!confirm("Are you sure you want to delete this category?")) return;
        try {
          await api.delete(`/domains/${id}`);
          showToast("Category deleted", "success");
          loadAdminData();
        } catch (err) {
          showToast(err.message, "error");
        }
      }
      async function deleteHead(id) {
        if (!confirm("Are you sure you want to delete this Domain Head?"))
          return;
        try {
          await api.delete(`/admin/domain-heads/${id}`);
          showToast("Domain Head deleted", "success");
          loadAdminData();
        } catch (err) {
          showToast(err.message, "error");
        }
      }
      loadAdminData();
    </script>
  </body>
</html>
