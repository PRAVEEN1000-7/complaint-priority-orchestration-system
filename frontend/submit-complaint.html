<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Complaint ComplaintOS</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav id="navbar"></nav>
    <main class="container">
        <h1>Submit a Complaint</h1>
        <p>Your complaint will be analyzed by AI to determine priority and route it to the correct department.</p>
        <div class="card" style="margin-top: 2rem;">
            <form id="complaintForm">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" required placeholder="Brief summary of the issue">
                </div>
                <div class="form-group">
                    <label for="domain_id">Category</label>
                    <select id="domain_id" required>
                        <option value="">Select a category...</option>
                    </select>
                    <p style="font-size: 0.8rem; margin-top: 0.25rem;">AI may reassign the category if a better match is found.</p>
                </div>
                <div class="form-group">
                    <label for="description">Detailed Description</label>
                    <textarea id="description" required placeholder="Please provide as much detail as possible..."></textarea>
                </div>
                <div id="errorMsg" style="display:none; color: var(--p1); margin-bottom: 1rem; font-size: 0.9rem;"></div>
                <button type="submit" id="submitBtn" class="btn btn-primary">Submit Complaint</button>
            </form>
        </div>
    </main>
    <div class="modal-overlay" id="successModal" style="display:none;">
        <div class="modal">
            <h3>Complaint Submitted Successfully</h3>
            <p><strong>Priority Assigned:</strong> <span id="modalPriority" class="badge"></span></p>
            <p><strong>Category:</strong> <span id="modalDomain"></span></p>
            <p><strong>AI Reasoning:</strong></p>
            <p id="modalReason" style="background: var(--bg-alt); padding: 1rem; border-radius: 4px; font-size: 0.9rem; border: 1px solid var(--border);"></p>
            <div style="margin-top: 1.5rem; text-align: right;">
                <button class="btn btn-primary" onclick="window.location.href='/static/complaint-history.html'">View My Complaints</button>
            </div>
        </div>
    </div>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/app.js"></script>
    <script>
        requireAuth();
        requireRole('user');
        async function loadDomains() {
            try {
                const domains = await api.get('/domains');
                const select = document.getElementById('domain_id');
                domains.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d.id;
                    opt.textContent = d.domain_name;
                    select.appendChild(opt);
                });
            } catch (error) {
                showToast('Failed to load categories', 'error');
            }
        }
        loadDomains();
        document.getElementById('complaintForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');
            btn.disabled = true;
            btn.textContent = 'Analyzing and Submitting...';
            errorMsg.style.display = 'none';
            try {
                const data = await api.post('/complaints', {
                    title: document.getElementById('title').value,
                    description: document.getElementById('description').value,
                    domain_id: document.getElementById('domain_id').value
                });
                document.getElementById('modalPriority').textContent = priorityLabel(data.priority);
                document.getElementById('modalPriority').className = `badge ${priorityBadgeClass(data.priority)}`;
                document.getElementById('modalDomain').textContent = data.domain_name;
                document.getElementById('modalReason').textContent = data.ai_reason;
                document.getElementById('successModal').style.display = 'flex';
            } catch (error) {
                errorMsg.textContent = error.message;
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Submit Complaint';
            }
        });
    </script>
</body>
</html>
